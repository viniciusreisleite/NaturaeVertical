<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naturae Nutribar - Vertical TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #000000;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #be7556, #4a6741);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="player" autoplay playsinline muted loop preload="auto"></video>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress"></div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const progressBar = document.getElementById('progress');

    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('post')) || 1;

    let consecutiveErrors = 0;
    const maxConsecutiveErrors = 5;

    // Tratamento de falhas e reconexão automática
    player.addEventListener('error', () => {
      consecutiveErrors++;
      if (consecutiveErrors >= maxConsecutiveErrors) {
        setTimeout(() => {
          window.location.reload();
        }, 3000);
      } else {
        setTimeout(() => {
          player.load();
          player.play().catch(() => {});
        }, 3000);
      }
    });

    player.addEventListener('playing', () => {
      consecutiveErrors = 0;
    });

    async function loadVideo() {
      const timestamp = new Date().getTime();
      try {
        const res = await fetch(`data.json?t=${timestamp}`);
        const posts = await res.json();
        
        const currentPost = posts.find(p => p.id === postId) || posts[0];
        if (!currentPost) return;

        const videoFile = currentPost.video_file || `video_${postId}.mp4`;
        player.src = `${videoFile}?t=${timestamp}`;
        player.load();
        player.play().catch(e => console.log('Autoplay:', e));
      } catch (e) {
        console.log('Erro ao carregar dados:', e);
      }
    }

    // Barra de progresso do vídeo
    player.addEventListener('timeupdate', () => {
      if (player.duration) {
        const pct = (player.currentTime / player.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    // Fallback de reinício caso o loop nativo do navegador falhe
    player.addEventListener('ended', () => {
      player.currentTime = 0;
      player.play().catch(e => console.log('Erro ao reiniciar:', e));
    });

    // Verificação de segurança: se o vídeo pausar sozinho antes da troca de tela, força o play
    setInterval(() => {
      if (player.paused && player.readyState >= 2) {
        player.play().catch(() => {});
      }
    }, 2000);

    loadVideo();
  </script>
</body>
</html>
