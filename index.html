<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Vertical - Naturae NutriBar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    .tv-container-vertical {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000 !important;
      background-color: #000 !important;
      display: block;
    }
  </style>
</head>
<body>

  <div class="tv-container-vertical">
    <img id="image-player" style="display:none;" />
    <video id="player" autoplay playsinline muted loop preload="auto">
      <source id="video-source" src="" type="video/mp4">
    </video>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      const timestamp = Date.now();
      let posts = [];

      try {
        const response = await fetch(`./data.json?t=${timestamp}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        posts = await response.json();
      } catch (err) {
        console.error("Erro ao carregar data.json:", err);
      }

      if (!Array.isArray(posts) || posts.length === 0) return;

      const urlParams = new URLSearchParams(window.location.search);
      const postParam = urlParams.get('post');
      const postIdx = parseInt(postParam, 10);

      let currentPost = posts[0];
      if (!isNaN(postIdx)) {
        currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
      }

      const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
      const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

      if (isFoto) {
        if (player) {
          player.pause();
          player.style.display = 'none';
        }
        if (imagePlayer) {
          imagePlayer.style.display = 'block';
          imagePlayer.src = `./${midiaArquivo}?t=${timestamp}`;
        }
      } else {
        if (imagePlayer) imagePlayer.style.display = 'none';
        if (player && videoSource) {
          player.style.display = 'block';
          player.style.backgroundColor = '#000';
          player.loop = true;

          player.onended = () => {
            player.currentTime = 0;
            player.play().catch(() => {});
          };

          videoSource.src = `./${midiaArquivo}?t=${timestamp}`;
          player.load();
          player.play().catch(e => console.log('Autoplay:', e));
        }
      }
    });
  </script>
</body>
</html>
